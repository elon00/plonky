services:
  workbench:
    build:
      context: ..
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ../.env.production
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 30s
