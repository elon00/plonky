name: CodeQL
'on':
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, rust, actions]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      if: matrix.language == 'rust'
      with:
        toolchain: stable
    - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended
    - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
      with:
        output: reports/codeql
        category: /language:${{ matrix.language }}
    - name: Reject high/critical findings and incomplete SARIF
      run: python tools/codeql_gate.py --languages ${{ matrix.language }}
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: codeql-${{ matrix.language }}
        path: reports/codeql
        if-no-files-found: error
