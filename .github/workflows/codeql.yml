name: CodeQL
'on':
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
      with:
        languages: python,javascript-typescript
        build-mode: none
        queries: security-extended
    - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
      with:
        output: reports/codeql
    - name: Reject high/critical findings and incomplete SARIF
      run: python tools/codeql_gate.py
