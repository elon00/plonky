name: Verified core
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: stable
        components: rustfmt,clippy
    - run: python -m pip install --require-hashes -r requirements.txt
    - run: cargo fmt --all -- --check
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - run: python tests/reality_check_harness.py
    - run: node --check web/app.js
    - run: npm ci --ignore-scripts
    - run: npm test
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
      with:
        version: v1.8.5
    - run: npm ci --ignore-scripts
    - run: forge test -vv
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - run: python tools/dependency_audit.py
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: dependency-audit
        path: reports/dependency-audit.json
      if: always()
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - run: docker build -t qmoosa:ci .
    - run: python tools/container_check.py --image qmoosa:ci
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: stable
        components: rustfmt,clippy
    - run: npm ci --ignore-scripts
    - run: python tools/build_web.py --install-tools
    - run: python -m pip install --require-hashes -r requirements-browser.txt
    - run: python -m playwright install --with-deps chromium
    - run: python tools/web_check.py
    - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      if: github.repository == 'elon00/plonky' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
      with:
        path: site
      if: github.repository == 'elon00/plonky' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: browser-evidence
        path: 'reports/wasm-browser.json

          reports/wasm-desktop.png

          reports/wasm-mobile.png'
      if: always()
    permissions:
      contents: read
      pages: read
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out immutable scanner and policy outside the target repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: elon00/qmoosa-1000
        ref: 9900daea33de9c723f7b3d89d09363e90e8bb84b
        path: trusted-security
        persist-credentials: false
    - name: Check out complete target history separately
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: project
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install checksum-pinned credential scanner
      run: python trusted-security/tools/security_guard.py install
    - name: Verify trusted scanner protections and exact-fixture boundaries
      run: python -m unittest discover -s trusted-security/tests -p test_security_guard.py -v
    - name: Scan target history, merge diffs and commit/tag messages
      run: python trusted-security/tools/security_guard.py scan --repo project --report reports/credential-scan.json
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: credential-scan
        path: reports/credential-scan.json
        if-no-files-found: error
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  required:
    name: Required release gate
    if: ${{ always() }}
    needs: [core, contracts, security, credentials, container, web, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Reject failed, skipped, cancelled or missing checks
      run: python tools/release_gate.py --report reports/release-gate.json
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: release-gate
        path: reports/release-gate.json
        if-no-files-found: error
  deploy:
    if: github.repository == 'elon00/plonky' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [required]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      id: deployment
      name: Publish verified browser demo
